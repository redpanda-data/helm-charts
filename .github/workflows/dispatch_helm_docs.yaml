---
# This workflow triggers the action in redpanda-data/rp-connect-docs that
# publishes the Redpanda Connect Helm chart specification to the Redpanda
# documentation (.github/workflows/generate-helm-spec.yml in that repo).
#
# The Redpanda, Console and Operator chart specs are generated by
# redpanda-data/docs from redpanda-data/redpanda-operator on each operator
# release, so no dispatch to the docs repo is needed from here.
name: Trigger Helm spec docs
on:
  push:
    branches: [main]
    paths:
      - 'charts/**'
jobs:
  dispatch:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write
    steps:
      - uses: aws-actions/configure-aws-credentials@v6
        with:
          aws-region: ${{ vars.RP_AWS_CRED_REGION }}
          role-to-assume: arn:aws:iam::${{ secrets.RP_AWS_CRED_ACCOUNT_ID }}:role/${{ vars.RP_AWS_CRED_BASE_ROLE_NAME }}${{ github.event.repository.name }}
      - uses: aws-actions/aws-secretsmanager-get-secrets@v3
        with:
          secret-ids: |
            ,sdlc/prod/github/actions_bot_token
          parse-json-secrets: true
      - name: Trigger doc generation in rp-connect-docs repo
        uses: peter-evans/repository-dispatch@v4
        with:
          token: ${{ env.ACTIONS_BOT_TOKEN }}
          repository: redpanda-data/rp-connect-docs
          event-type: generate-helm-spec-docs
